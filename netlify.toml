[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Deploy Previews (PRs) and branch deploys use the same build command and
# publish dir automatically. Make sure CATWORDLE_SUPABASE_URL and
# CATWORDLE_SUPABASE_ANON_KEY are set for "All deploy contexts" in Site settings ->
# Environment variables, not just Production, or preview builds will fail.
